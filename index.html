<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Mahasiswa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #e8f1ff;
      background: #070b1a;
      overflow-x: hidden;
    }

    /* Background blob animasi */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .55;
      z-index: 0;
      animation: float 12s ease-in-out infinite alternate;
    }
    .blob.b1 { width: 420px; height: 420px; background: #1769aa; top: -120px; left: -100px; }
    .blob.b2 { width: 380px; height: 380px; background: #7c3aed; bottom: -120px; right: -80px; animation-delay: -4s; }
    .blob.b3 { width: 260px; height: 260px; background: #06b6d4; top: 45%; left: 55%; animation-delay: -8s; }

    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.15); }
    }

    /* Kartu glassmorphism */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 44px 32px 32px;
      text-align: center;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, .5);
      animation: muncul .9s cubic-bezier(.2, .8, .2, 1) both;
      transition: transform .2s ease;
    }
    @keyframes muncul {
      from { opacity: 0; transform: translateY(40px) scale(.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Avatar dengan ring gradien berputar */
    .avatar {
      width: 128px;
      height: 128px;
      margin: 0 auto 22px;
      border-radius: 50%;
      padding: 4px;
      background: conic-gradient(#06b6d4, #7c3aed, #ec4899, #06b6d4);
      animation: putar 5s linear infinite;
    }
    .avatar span {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #0b1230;
      font-size: 44px;
      font-weight: 800;
      animation: putar 5s linear infinite reverse;
    }
    @keyframes putar { to { transform: rotate(360deg); } }

    .badge {
      display: inline-block;
      padding: 5px 16px;
      margin-bottom: 14px;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 999px;
      background: rgba(6, 182, 212, .15);
      border: 1px solid rgba(6, 182, 212, .5);
      color: #67e8f9;
    }

    h1 {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.15;
      background: linear-gradient(90deg, #67e8f9, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .prodi { margin-top: 8px; font-size: 14px; color: #b6c4e0; }

    .typing {
      margin: 18px 0 22px;
      min-height: 28px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }
    .typing::after {
      content: '|';
      margin-left: 2px;
      color: #67e8f9;
      animation: kedip .8s steps(1) infinite;
    }
    @keyframes kedip { 50% { opacity: 0; } }

    /* Chip skill */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 26px; }
    .chip {
      padding: 7px 14px;
      font-size: 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .15);
      transition: all .25s;
    }
    .chip:hover {
      transform: translateY(-4px);
      background: linear-gradient(90deg, #1769aa, #7c3aed);
      border-color: transparent;
      box-shadow: 0 8px 20px rgba(124, 58, 237, .45);
    }

    /* Statistik */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 26px;
    }
    .stat {
      padding: 14px 6px;
      border-radius: 16px;
      background: rgba(255, 255, 255, .06);
    }
    .stat b { display: block; font-size: 22px; color: #67e8f9; }
    .stat small { font-size: 11px; color: #9fb0d0; }

    /* Tombol */
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      color: #fff;
      border-radius: 14px;
      background: linear-gradient(90deg, #1769aa, #7c3aed, #ec4899);
      background-size: 200% 100%;
      transition: background-position .5s, transform .2s, box-shadow .3s;
    }
    .btn:hover {
      background-position: 100% 0;
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(236, 72, 153, .4);
    }

    .footer { margin-top: 18px; font-size: 12px; color: #7f90b3; }

    @media (max-width: 480px) {
      h1 { font-size: 28px; }
      .card { padding: 36px 20px 24px; }
    }
  </style>
</head>

  <script>
    // Efek mengetik bergantian
    const teks = [
      'Saya sedang belajar Cloud Computing ☁️',
      'Suka membangun website 🚀',
      'Siap jadi profesional IT 🔥'
    ];
    const el = document.getElementById('typing');
    let i = 0, j = 0, hapus = false;

      const kata = teks[i];
      el.textContent = kata.substring(0, j);

<style>

    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 5;

  }

<canvas id="spiders"></canvas>
<div class="spider-hint">🕷️ Gerakkan kursor dan klik layar untuk memanggil laba-laba</div>

<script>
  (function () {
    const canvas = document.getElementById('spiders');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      W = innerWidth; H = innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    addEventListener('resize', resize);

    const mouse = { x: W / 2, y: H / 2, last: 0 };
    addEventListener('pointermove', e => {
      mouse.x = e.clientX; mouse.y = e.clientY; mouse.last = performance.now();
    });

    const LEG_COLOR = 'rgba(196, 181, 253, 0.95)';
    const GLOW = '#8b5cf6';

    // --- Laba-laba berjalan (kaki dengan IK 2 ruas) ---
    class Spider {
      constructor(x, y, scale) {
        this.x = x; this.y = y;
        this.scale = scale;
        this.angle = Math.random() * Math.PI * 2;
        this.speed = 0;
        this.maxSpeed = 2.6 * scale + Math.random() * 0.8;
        this.target = { x, y };
        this.pickWander();
        this.reach = 62 * scale;
        this.legs = [];
        const offs = [-0.75, -0.25, 0.25, 0.75];
        for (let side = -1; side <= 1; side += 2) {
          for (let k = 0; k < 4; k++) {
            const leg = {
              side, off: offs[k],
              group: (k + (side > 0 ? 0 : 1)) % 2,
              fx: 0, fy: 0, sx: 0, sy: 0, tx: 0, ty: 0, t: 1
            };
            const d = this.desired(leg);
            leg.fx = leg.tx = leg.sx = d.x;
            leg.fy = leg.ty = leg.sy = d.y;
            this.legs.push(leg);
          }
        }
      }
      pickWander() {
        this.target.x = 60 + Math.random() * (W - 120);
        this.target.y = 60 + Math.random() * (H - 120);
      }
      desired(leg) {
        const dir = this.angle + leg.side * (Math.PI / 2 + leg.off);
        const lead = this.speed * 7;
        return {
          x: this.x + Math.cos(dir) * this.reach + Math.cos(this.angle) * lead,
          y: this.y + Math.sin(dir) * this.reach + Math.sin(this.angle) * lead
        };
      }
      update(now) {
        const active = now - mouse.last < 3500;
        if (active) { this.target.x = mouse.x; this.target.y = mouse.y; }
        let dx = this.target.x - this.x, dy = this.target.y - this.y;
        let dist = Math.hypot(dx, dy);
        if (dist < 50 * this.scale) {
          if (!active) this.pickWander();
        }
        const want = Math.atan2(dy, dx);
        let diff = want - this.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        this.angle += diff * 0.07;
        const goal = dist < 50 * this.scale ? 0 : Math.min(this.maxSpeed, dist * 0.04 + 0.6);
        this.speed += (goal - this.speed) * 0.08;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;

        const stepping = [false, false];
        for (const l of this.legs) if (l.t < 1) stepping[l.group] = true;
        for (const l of this.legs) {
          if (l.t < 1) {
            l.t = Math.min(1, l.t + 0.2);
            const e = l.t * l.t * (3 - 2 * l.t);
            l.fx = l.sx + (l.tx - l.sx) * e;
            l.fy = l.sy + (l.ty - l.sy) * e;
          } else {
            const d = this.desired(l);
            if (Math.hypot(d.x - l.fx, d.y - l.fy) > this.reach * 0.5 && !stepping[1 - l.group]) {
              l.sx = l.fx; l.sy = l.fy; l.tx = d.x; l.ty = d.y; l.t = 0;
              stepping[l.group] = true;
            }
          }
        }
      }
      draw() {
        const s = this.scale;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = GLOW;
        ctx.shadowBlur = 10;

        ctx.strokeStyle = LEG_COLOR;
        ctx.lineWidth = 2.2 * s;
        const L = this.reach * 0.62;
        for (const l of this.legs) {
          const dir = this.angle + l.side * (Math.PI / 2 + l.off);
          const hx = this.x + Math.cos(dir) * 9 * s;
          const hy = this.y + Math.sin(dir) * 9 * s;
          let dx = l.fx - hx, dy = l.fy - hy;
          let d = Math.hypot(dx, dy) || 1;
          const dd = Math.min(d, L * 2 - 0.5);
          const h = Math.sqrt(Math.max(0, L * L - (dd / 2) * (dd / 2)));
          const mx = hx + dx / d * dd / 2, my = hy + dy / d * dd / 2;
          const kx = mx + (-dy / d) * h * l.side;
          const ky = my + (dx / d) * h * l.side;
          ctx.beginPath();
          ctx.moveTo(hx, hy);
          ctx.lineTo(kx, ky);
          ctx.lineTo(hx + dx / d * dd, hy + dy / d * dd);
          ctx.stroke();
        }

        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        const grad = ctx.createRadialGradient(-12 * s, -3 * s, 2, -12 * s, 0, 18 * s);
        grad.addColorStop(0, '#6d28d9');
        grad.addColorStop(1, '#14082e');
        ctx.fillStyle = grad;
        ctx.strokeStyle = '#a78bfa';
        ctx.lineWidth = 1.4 * s;
        ctx.beginPath(); ctx.ellipse(-13 * s, 0, 15 * s, 11 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#1b0f3d';
        ctx.beginPath(); ctx.ellipse(4 * s, 0, 9 * s, 7.5 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ec4899';
        ctx.beginPath(); ctx.ellipse(-14 * s, 0, 5 * s, 2.6 * s, 0, 0, Math.PI * 2); ctx.fill();
        ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 8;
        ctx.fillStyle = '#67e8f9';
        for (const ey of [-2.6, 2.6]) {
          ctx.beginPath(); ctx.arc(10 * s, ey * s, 1.8 * s, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }
    }

    // --- Laba-laba menggantung di benang ---
    class Hanger {
      constructor(x, len, scale, phase) {
        this.x = x; this.len = len; this.scale = scale; this.phase = phase;
      }
      draw(t) {
        const s = this.scale;
        const y = this.len + Math.sin(t * 0.0012 + this.phase) * this.len * 0.22;
        const x = this.x + Math.sin(t * 0.0008 + this.phase) * 6;
        ctx.save();
        ctx.shadowColor = GLOW; ctx.shadowBlur = 8;
        ctx.strokeStyle = 'rgba(220, 225, 255, 0.55)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(this.x, 0); ctx.lineTo(x, y); ctx.stroke();

        ctx.translate(x, y);
        ctx.strokeStyle = LEG_COLOR;
        ctx.lineWidth = 1.8 * s;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for (let side = -1; side <= 1; side += 2) {
          for (let k = 0; k < 4; k++) {
            const a = (k - 1.5) * 0.42 + Math.sin(t * 0.006 + k + this.phase) * 0.18;
            const bx = side * 8 * s, by = (k - 1.5) * 3 * s;
            const kx = bx + side * 18 * s * Math.cos(a), ky = by - 14 * s + a * 14 * s;
            const fx = kx + side * 6 * s, fy = ky + 22 * s;
            ctx.beginPath(); ctx.moveTo(bx * 0.4, by); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
          }
        }
        const g = ctx.createRadialGradient(-2 * s, 2 * s, 1, 0, 6 * s, 14 * s);
        g.addColorStop(0, '#6d28d9'); g.addColorStop(1, '#14082e');
        ctx.fillStyle = g; ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 1.3 * s;
        ctx.beginPath(); ctx.ellipse(0, 9 * s, 10 * s, 13 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#1b0f3d';
        ctx.beginPath(); ctx.ellipse(0, -5 * s, 7 * s, 6 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 8; ctx.fillStyle = '#67e8f9';
        for (const ex of [-2.6, 2.6]) { ctx.beginPath(); ctx.arc(ex * s, -7 * s, 1.6 * s, 0, Math.PI * 2); ctx.fill(); }
        ctx.restore();
      }
    }

    const spiders = [
      new Spider(W * 0.15, H * 0.85, 1),
      new Spider(W * 0.85, H * 0.2, 0.8)
    ];
    const hangers = [
      new Hanger(W * 0.08, 90, 0.9, 0),
      new Hanger(W * 0.9, 150, 1.1, 2),
      new Hanger(W * 0.7, 60, 0.7, 4)
    ];

    addEventListener('pointerdown', e => {
      if (spiders.length >= 8) spiders.shift();
      spiders.push(new Spider(e.clientX, e.clientY, 0.6 + Math.random() * 0.6));
    });

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function loop(now) {
      ctx.clearRect(0, 0, W, H);
      for (const h of hangers) h.draw(now);
      for (const s of spiders) { if (!reduce) s.update(now); s.draw(); }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
</script>

<canvas id="kota"></canvas>

<script>
  (function () {
    // ====== PENGATURAN BILBOARD ======
    const FOTO_SRC = 'foto.jpg';   // nama file foto (simpan satu folder dengan index.html)
    const TEKS_BILBOARD = '';      // opsional, mis. 'FAREL' (kosongkan kalau tidak mau teks)
    // =================================

    const cv = document.getElementById('kota');
    const c = cv.getContext('2d');
    let W = 0, H = 0, layers = [], stars = [], cars = [];
    let shoot = null, nextShoot = 3000;
    const mouse = { x: 0.5, sx: 0.5 };
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const foto = new Image();
    let fotoOk = false;
    foto.onload = function () { fotoOk = true; };
    foto.src = FOTO_SRC;

    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const WARM = ['#fde68a', '#fcd34d', '#fff7d6', '#fde68a', '#fbbf24'];
    const COOL = ['#67e8f9', '#f9a8d4', '#a5b4fc'];

    const CFG = [
      { seed: 11, color: '#141a47', top: 'rgba(167,139,250,.35)', hMin: .16, hMax: .36, wMin: 50, wMax: 100, cw: 12, ch: 17, lit: .22, par: 8,  alpha: .55 },
      { seed: 29, color: '#0c1030', top: 'rgba(103,232,249,.28)', hMin: .22, hMax: .48, wMin: 60, wMax: 120, cw: 13, ch: 18, lit: .32, par: 18, alpha: .8 },
      { seed: 53, color: '#05071a', top: 'rgba(236,72,153,.35)',  hMin: .26, hMax: .58, wMin: 70, wMax: 140, cw: 14, ch: 19, lit: .42, par: 34, alpha: 1 }
    ];

    function build() {
      const dpr = window.devicePixelRatio || 1;
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);

      layers = CFG.map(cfg => {
        const rnd = mulberry32(cfg.seed);
        const bs = [];
        let x = -90;
        while (x < W + 90) {
          const w = cfg.wMin + rnd() * (cfg.wMax - cfg.wMin);
          const h = Math.max(80, H * (cfg.hMin + rnd() * (cfg.hMax - cfg.hMin)));
          const r = rnd();
          const roof = r < .22 ? 1 : (r < .45 ? 2 : 0);
          const cols = Math.max(1, Math.floor((w - 12) / cfg.cw));
          const rows = Math.max(1, Math.floor((h - 26) / cfg.ch));
          const offX = (w - cols * cfg.cw) / 2 + 1;
          const wins = [];
          for (let rr = 0; rr < rows; rr++) {
            for (let cc = 0; cc < cols; cc++) {
              const cool = rnd() < .12;
              const pal = cool ? COOL : WARM;
              wins.push({
                x: offX + cc * cfg.cw, y: 16 + rr * cfg.ch,
                lit: rnd() < cfg.lit,
                col: pal[Math.floor(rnd() * pal.length)]
              });
            }
          }
          bs.push({ x, w, h, roof, wins, ph: rnd() * 6 });
          x += w + rnd() * 6;
        }
        return { cfg, bs };
      });

      placeBoard();

      stars = Array.from({ length: Math.floor(W * H / 9000) }, () => ({
        x: Math.random() * W,
        y: Math.random() * H * 0.62,
        r: Math.random() * 1.2 + .3,
        p: Math.random() * 6
      }));

      cars = Array.from({ length: 9 }, (_, i) => ({
        x: Math.random() * W,
        dir: i % 2 ? 1 : -1,
        lane: i % 2 ? 0 : 1,
        v: .8 + Math.random() * 1.6
      }));
    }

    // Pilih gedung di sisi kiri untuk dipasangi bilboard
    function placeBoard() {
      const bs = layers[1].bs;
      let best = null, bestScore = -1e9;
      for (const b of bs) {
        const cx = b.x + b.w / 2;
        if (cx < W * .05 || cx > W * .36) continue;
        if (H - b.h < 170) continue;
        const score = -Math.abs(cx - W * .19);
        if (score > bestScore) { bestScore = score; best = b; }
      }
      if (!best) {
        let maxRoom = -1;
        for (const b of bs) {
          const cx = b.x + b.w / 2;
          if (cx < 0 || cx > W) continue;
          if (H - b.h > maxRoom) { maxRoom = H - b.h; best = b; }
        }
      }
      if (!best) return;
      const post = 22;
      const target = Math.min(190, Math.max(110, W * .11));
      let bh = Math.min(target * 1.15, H - best.h - post - 30);
      bh = Math.max(70, bh);
      best.roof = 0;
      best.board = { w: bh / 1.15, h: bh, post: post };
    }

    build();
    addEventListener('resize', build);
    addEventListener('pointermove', e => { mouse.x = e.clientX / innerWidth; });

    function drawCover(img, x, y, w, h) {
      const ir = img.width / img.height, br = w / h;
      let sw, sh, sx, sy;
      if (ir > br) { sh = img.height; sw = sh * br; sx = (img.width - sw) / 2; sy = 0; }
      else { sw = img.width; sh = sw / br; sx = 0; sy = (img.height - sh) * 0.2; }
      c.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    }

    function drawBoard(b, top, t) {
      const bd = b.board;
      const cx = b.x + b.w / 2;
      const bx = cx - bd.w / 2;
      const by = top - bd.post - bd.h;

      // tiang & rangka
      c.strokeStyle = '#1c2456';
      c.lineWidth = 3;
      c.beginPath();
      c.moveTo(bx + bd.w * .2, top); c.lineTo(bx + bd.w * .2, by + bd.h);
      c.moveTo(bx + bd.w * .8, top); c.lineTo(bx + bd.w * .8, by + bd.h);
      c.stroke();
      c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(bx + bd.w * .2, top); c.lineTo(bx + bd.w * .8, by + bd.h);
      c.moveTo(bx + bd.w * .8, top); c.lineTo(bx + bd.w * .2, by + bd.h);
      c.stroke();

      // cahaya menyebar di sekitar bilboard
      const gy = by + bd.h / 2;
      const glow = c.createRadialGradient(cx, gy, 10, cx, gy, bd.w * 1.1);
      glow.addColorStop(0, 'rgba(236,72,153,.34)');
      glow.addColorStop(1, 'rgba(236,72,153,0)');
      c.fillStyle = glow;
      c.fillRect(cx - bd.w * 1.2, gy - bd.w * 1.2, bd.w * 2.4, bd.w * 2.4);

      // bingkai neon
      c.fillStyle = '#0a0d28';
      c.fillRect(bx - 6, by - 6, bd.w + 12, bd.h + 12);
      const ng = c.createLinearGradient(bx, by, bx + bd.w, by + bd.h);
      ng.addColorStop(0, '#67e8f9');
      ng.addColorStop(.5, '#a78bfa');
      ng.addColorStop(1, '#ec4899');
      c.strokeStyle = ng;
      c.lineWidth = 3;
      c.shadowColor = '#a78bfa';
      c.shadowBlur = 16;
      c.strokeRect(bx - 6, by - 6, bd.w + 12, bd.h + 12);
      c.shadowBlur = 0;

      // isi layar (foto)
      c.save();
      c.beginPath(); c.rect(bx, by, bd.w, bd.h); c.clip();
      if (fotoOk) {
        drawCover(foto, bx, by, bd.w, bd.h);
      } else {
        const pg = c.createLinearGradient(bx, by, bx + bd.w, by + bd.h);
        pg.addColorStop(0, '#1e1b4b'); pg.addColorStop(1, '#581c87');
        c.fillStyle = pg; c.fillRect(bx, by, bd.w, bd.h);
        c.fillStyle = 'rgba(255,255,255,.7)';
        c.font = '600 ' + Math.max(10, bd.w * .1) + 'px system-ui, sans-serif';
        c.textAlign = 'center';
        c.fillText(FOTO_SRC, cx, by + bd.h / 2);
      }
      // kedip tipis ala layar LED
      c.fillStyle = 'rgba(0,0,0,' + (0.05 + 0.05 * Math.sin(t * .004 + b.ph)) + ')';
      c.fillRect(bx, by, bd.w, bd.h);
      // garis scanline
      c.fillStyle = 'rgba(0,0,0,.14)';
      for (let y = by; y < by + bd.h; y += 3) c.fillRect(bx, y, bd.w, 1);
      // kilau kaca
      const sheen = c.createLinearGradient(bx, by, bx + bd.w, by + bd.h);
      sheen.addColorStop(0, 'rgba(255,255,255,.16)');
      sheen.addColorStop(.45, 'rgba(255,255,255,0)');
      c.fillStyle = sheen;
      c.fillRect(bx, by, bd.w, bd.h);
      // teks opsional
      if (TEKS_BILBOARD) {
        const fh = Math.max(14, bd.h * .13);
        c.fillStyle = 'rgba(5,7,26,.72)';
        c.fillRect(bx, by + bd.h - fh * 1.6, bd.w, fh * 1.6);
        c.fillStyle = '#67e8f9';
        c.shadowColor = '#67e8f9'; c.shadowBlur = 8;
        c.font = '800 ' + fh + 'px system-ui, sans-serif';
        c.textAlign = 'center';
        c.fillText(TEKS_BILBOARD, cx, by + bd.h - fh * .45);
        c.shadowBlur = 0;
      }
      c.restore();

      // lampu sorot di atas bilboard
      for (const f of [.2, .5, .8]) {
        const lx = bx + bd.w * f;
        c.fillStyle = 'rgba(255,240,190,.09)';
        c.beginPath();
        c.moveTo(lx, by - 8);
        c.lineTo(lx - bd.w * .2, by + bd.h * .6);
        c.lineTo(lx + bd.w * .2, by + bd.h * .6);
        c.closePath(); c.fill();
        c.strokeStyle = '#2a3270'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(lx, by - 6); c.lineTo(lx, by - 11); c.stroke();
        c.fillStyle = '#fff6c9';
        c.shadowColor = '#fde68a'; c.shadowBlur = 10;
        c.beginPath(); c.arc(lx, by - 12, 2.4, 0, Math.PI * 2); c.fill();
        c.shadowBlur = 0;
      }
    }

    function drawSky(t) {
      const g = c.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#04061a');
      g.addColorStop(.5, '#17104a');
      g.addColorStop(.85, '#4a2282');
      g.addColorStop(1, '#7a2f8f');
      c.fillStyle = g; c.fillRect(0, 0, W, H);

      const hg = c.createRadialGradient(W * .5, H, 10, W * .5, H, Math.max(W, H) * .7);
      hg.addColorStop(0, 'rgba(236,72,153,.30)');
      hg.addColorStop(1, 'rgba(236,72,153,0)');
      c.fillStyle = hg; c.fillRect(0, 0, W, H);

      for (const s of stars) {
        const a = .35 + .65 * Math.abs(Math.sin(t * .0015 + s.p));
        c.fillStyle = `rgba(255,255,255,${a})`;
        c.beginPath(); c.arc(s.x, s.y, s.r, 0, Math.PI * 2); c.fill();
      }

      const mx = W * .8, my = Math.min(150, H * .2), mr = 26;
      const mg = c.createRadialGradient(mx, my, mr * .6, mx, my, mr * 4);
      mg.addColorStop(0, 'rgba(253,246,214,.35)');
      mg.addColorStop(1, 'rgba(253,246,214,0)');
      c.fillStyle = mg; c.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
      c.fillStyle = '#fdf6d6';
      c.beginPath(); c.arc(mx, my, mr, 0, Math.PI * 2); c.fill();
      c.fillStyle = 'rgba(190,175,140,.35)';
      c.beginPath(); c.arc(mx - 8, my - 5, 5, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(mx + 7, my + 8, 3.6, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(mx + 9, my - 9, 2.6, 0, Math.PI * 2); c.fill();

      if (!reduce) {
        if (!shoot && t > nextShoot) {
          shoot = { x: Math.random() * W * .8 + W * .1, y: Math.random() * H * .25, l: 0 };
        }
        if (shoot) {
          shoot.l += 9;
          const x2 = shoot.x + shoot.l * .8, y2 = shoot.y + shoot.l * .45;
          const sg = c.createLinearGradient(shoot.x + (shoot.l - 90) * .8, shoot.y + (shoot.l - 90) * .45, x2, y2);
          sg.addColorStop(0, 'rgba(255,255,255,0)');
          sg.addColorStop(1, 'rgba(255,255,255,.95)');
          c.strokeStyle = sg; c.lineWidth = 2; c.lineCap = 'round';
          c.beginPath();
          c.moveTo(shoot.x + Math.max(0, shoot.l - 90) * .8, shoot.y + Math.max(0, shoot.l - 90) * .45);
          c.lineTo(x2, y2); c.stroke();
          if (shoot.l > 420) { shoot = null; nextShoot = t + 5000 + Math.random() * 7000; }
        }
      }
    }

    function drawLayer(L, li, t) {
      const { cfg, bs } = L;
      const off = (mouse.sx - .5) * -cfg.par;
      c.save();
      c.translate(off, 0);
      for (const b of bs) {
        const top = H - b.h;
        c.fillStyle = cfg.color;
        c.fillRect(b.x, top, b.w, b.h + 2);
        if (b.roof === 2) c.fillRect(b.x + b.w * .2, top - 14, b.w * .6, 15);
        c.fillStyle = cfg.top;
        c.fillRect(b.x, top, b.w, 1.5);
        if (b.roof === 1) {
          c.strokeStyle = cfg.color; c.lineWidth = 2;
          c.beginPath(); c.moveTo(b.x + b.w / 2, top); c.lineTo(b.x + b.w / 2, top - 30); c.stroke();
          if (li > 0) {
            const a = .25 + .75 * (Math.sin(t * .004 + b.ph) > 0 ? 1 : 0);
            c.fillStyle = `rgba(255,70,90,${a})`;
            c.shadowColor = '#ff465a'; c.shadowBlur = 10;
            c.beginPath(); c.arc(b.x + b.w / 2, top - 31, 2.2, 0, Math.PI * 2); c.fill();
            c.shadowBlur = 0;
          }
        }
        if (b.board) drawBoard(b, top, t);
        c.globalAlpha = cfg.alpha;
        for (const w of b.wins) {
          if (!w.lit) continue;
          c.fillStyle = w.col;
          c.fillRect(b.x + w.x, top + w.y, 5, 8);
        }
        c.globalAlpha = 1;
      }
      c.restore();

      if (!reduce) {
        for (let n = 0; n < 4; n++) {
          const b = bs[Math.floor(Math.random() * bs.length)];
          const w = b.wins[Math.floor(Math.random() * b.wins.length)];
          if (w) w.lit = !w.lit;
        }
      }
    }

    function fog(alpha) {
      const g = c.createLinearGradient(0, H * .45, 0, H);
      g.addColorStop(0, 'rgba(120,50,150,0)');
      g.addColorStop(1, `rgba(236,72,153,${alpha})`);
      c.fillStyle = g; c.fillRect(0, H * .45, W, H * .55);
    }

    function drawStreet() {
      c.fillStyle = '#04050f';
      c.fillRect(0, H - 14, W, 14);
      for (const car of cars) {
        if (!reduce) {
          car.x += car.dir * car.v;
          if (car.x > W + 40) car.x = -40;
          if (car.x < -40) car.x = W + 40;
        }
        const y = H - 9 + car.lane * 5;
        const head = car.dir > 0;
        const col = head ? '255,240,190' : '255,60,80';
        const g = c.createLinearGradient(car.x, 0, car.x - car.dir * 26, 0);
        g.addColorStop(0, `rgba(${col},.9)`);
        g.addColorStop(1, `rgba(${col},0)`);
        c.strokeStyle = g; c.lineWidth = 2; c.lineCap = 'round';
        c.beginPath(); c.moveTo(car.x, y); c.lineTo(car.x - car.dir * 26, y); c.stroke();
        c.fillStyle = `rgb(${col})`;
        c.shadowColor = `rgb(${col})`; c.shadowBlur = 8;
        c.beginPath(); c.arc(car.x, y, 1.8, 0, Math.PI * 2); c.fill();
        c.shadowBlur = 0;
      }
    }

    function frame(t) {
      mouse.sx += (mouse.x - mouse.sx) * .05;
      c.clearRect(0, 0, W, H);
      drawSky(t);
      drawLayer(layers[0], 0, t);
      fog(.14);
      drawLayer(layers[1], 1, t);
      fog(.10);
      drawLayer(layers[2], 2, t);
      drawStreet();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
</script>
